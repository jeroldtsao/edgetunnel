name: Deploy to Cloudflare Workers

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'bootstrap: 初始化或修复 KV；deploy: 仅发布 Worker 更新'
        type: choice
        required: true
        default: deploy
        options:
          - deploy
          - bootstrap

  push:
    branches:
      - main
    paths:
      - '_worker.js'
      - 'wrangler.toml'
      - '.github/workflows/deploy.yml'

env:
  WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME || vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'edgetunnel' }}
  CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN || '' }}
  KV_ID: ${{ vars.KV_ID || '' }}
  KV_NAME: ${{ vars.KV_NAME || 'EDT2' }}
  WRANGLER_SEND_METRICS: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Cloudflare Worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Determine workflow mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail

          MODE="deploy"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${INPUT_MODE:-}" ]; then
            MODE="$INPUT_MODE"
          fi

          if [ "$MODE" != "deploy" ] && [ "$MODE" != "bootstrap" ]; then
            echo "::error::不支持的 mode: $MODE"
            exit 1
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "当前模式: $MODE"
        env:
          INPUT_MODE: ${{ github.event.inputs.mode || '' }}

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::缺少 Secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi

          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::缺少 Secret: CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

          if [ "$MODE" = "bootstrap" ]; then
            if [ -z "$KV_NAME" ]; then
              echo "::error::KV_NAME 不能为空"
              exit 1
            fi

            exit 0
          fi

          if [ -z "${ADMIN_PASSWORD:-}" ]; then
            echo "::error::缺少 Secret: ADMIN_PASSWORD"
            exit 1
          fi

          if [ -z "$KV_ID" ]; then
            echo "::error::缺少 Variable: KV_ID"
            echo "::error::请先手动运行 workflow_dispatch 并选择 mode=bootstrap，然后把 Summary 输出的 KV_ID 保存到仓库 Variables。"
            exit 1
          fi

          if [[ ! "$WORKER_NAME" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]]; then
            echo "::error::WORKER_NAME 只能包含小写字母、数字和连字符，且必须以字母或数字开头"
            exit 1
          fi

          if [ -n "$CUSTOM_DOMAIN" ]; then
            if [[ "$CUSTOM_DOMAIN" =~ ^https?:// ]] || [[ "$CUSTOM_DOMAIN" == */* ]] || [[ "$CUSTOM_DOMAIN" != *.* ]]; then
              echo "::error::CUSTOM_DOMAIN 请填写纯域名，例如 vless.example.com，不要带 https:// 或路径"
              exit 1
            fi
          fi
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Check Cloudflare auth
        run: wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Ensure KV namespace
        if: steps.mode.outputs.mode == 'bootstrap'
        id: kv
        shell: bash
        run: |
          set -euo pipefail

          echo "检查 KV 命名空间: $KV_NAME"
          KV_LIST=$(wrangler kv namespace list)
          KV_ID=$(node -e '
            const fs = require("fs");
            const name = process.argv[1];
            const list = JSON.parse(fs.readFileSync(0, "utf8"));
            const hit = list.find((item) => item.title === name);
            if (hit) process.stdout.write(hit.id);
          ' "$KV_NAME" <<< "$KV_LIST")

          if [ -z "$KV_ID" ]; then
            echo "创建 KV 命名空间: $KV_NAME"
            wrangler kv namespace create "$KV_NAME" --binding KV
            KV_LIST=$(wrangler kv namespace list)
            KV_ID=$(node -e '
              const fs = require("fs");
              const name = process.argv[1];
              const list = JSON.parse(fs.readFileSync(0, "utf8"));
              const hit = list.find((item) => item.title === name);
              if (hit) process.stdout.write(hit.id);
            ' "$KV_NAME" <<< "$KV_LIST")
          fi

          if [ -z "$KV_ID" ]; then
            echo "::error::无法获取 KV namespace id"
            exit 1
          fi

          echo "kv_id=$KV_ID" >> "$GITHUB_OUTPUT"
          echo "KV 绑定将使用 binding=KV, id=$KV_ID"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Generate Wrangler config
        if: steps.mode.outputs.mode == 'deploy'
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");

          const workerName = process.env.WORKER_NAME;
          const kvId = process.env.KV_ID;
          const customDomain = (process.env.CUSTOM_DOMAIN || "").trim().toLowerCase();

          const lines = [
            `name = ${JSON.stringify(workerName)}`,
            `main = ${JSON.stringify(`${process.cwd()}/_worker.js`)}`,
            `compatibility_date = "2025-11-04"`,
            `workers_dev = true`,
            `keep_vars = true`,
            ``,
            `[[kv_namespaces]]`,
            `binding = "KV"`,
            `id = ${JSON.stringify(kvId)}`,
          ];

          if (customDomain) {
            lines.push(
              ``,
              `[[routes]]`,
              `pattern = ${JSON.stringify(customDomain)}`,
              `custom_domain = true`,
            );
          }

          fs.writeFileSync("wrangler.generated.toml", `${lines.join("\n")}\n`);
          NODE

          echo "生成的部署配置:"
          sed 's/id = ".*"/id = "***"/' wrangler.generated.toml
      - name: Deploy Worker
        if: steps.mode.outputs.mode == 'deploy'
        id: deploy_worker
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f .worker-secrets.json' EXIT

          node <<'NODE' > .worker-secrets.json
          const fs = require("fs");

          const names = [
            ["ADMIN", "ADMIN_PASSWORD"],
            ["UUID", "UUID"],
            ["PROXYIP", "PROXYIP"],
            ["KEY", "KEY"],
            ["HOST", "HOST"],
            ["URL", "URL"],
            ["GO2SOCKS5", "GO2SOCKS5"],
            ["DEBUG", "DEBUG"],
            ["OFF_LOG", "OFF_LOG"],
            ["BEST_SUB", "BEST_SUB"],
          ];

          const secrets = {};
          for (const [binding, envName] of names) {
            const value = process.env[envName];
            if (value !== undefined && value !== "") secrets[binding] = value;
          }

          fs.writeFileSync(".worker-secrets.json", JSON.stringify(secrets));
          NODE

          wrangler deploy --config wrangler.generated.toml --secrets-file .worker-secrets.json | tee wrangler-deploy.log

          DEPLOY_URL=$(grep -Eo 'https://[^[:space:]]+' wrangler-deploy.log | tail -n 1 || true)
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          UUID: ${{ secrets.UUID }}
          PROXYIP: ${{ secrets.PROXYIP }}
          KEY: ${{ secrets.KEY }}
          HOST: ${{ secrets.HOST }}
          URL: ${{ secrets.URL }}
          GO2SOCKS5: ${{ secrets.GO2SOCKS5 }}
          DEBUG: ${{ secrets.DEBUG }}
          OFF_LOG: ${{ secrets.OFF_LOG }}
          BEST_SUB: ${{ secrets.BEST_SUB }}

      - name: Summary
        shell: bash
        run: |
          if [ "$MODE" = "bootstrap" ]; then
            {
              echo "## KV 初始化完成"
              echo ""
              echo "| 项目 | 值 |"
              echo "|------|-----|"
              echo "| KV 名称 | \`$KV_NAME\` |"
              echo "| KV ID | \`${{ steps.kv.outputs.kv_id }}\` |"
              echo ""
              echo "下一步："
              echo "1. 把 \`KV_ID=${{ steps.kv.outputs.kv_id }}\` 保存到仓库 Variables。"
              echo "2. 重新手动运行本 workflow 并选择 \`deploy\`，或直接推送代码到 \`main\`。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## 部署完成"
            echo ""
            echo "| 项目 | 值 |"
            echo "|------|-----|"
            echo "| Worker | \`$WORKER_NAME\` |"
            if [ -n "${{ steps.deploy_worker.outputs.deploy_url }}" ]; then
              echo "| 默认地址 | ${{ steps.deploy_worker.outputs.deploy_url }} |"
            fi
            echo "| KV 绑定 | \`KV\` -> \`$KV_ID\` |"
            if [ -n "$CUSTOM_DOMAIN" ]; then
              echo "| 自定义域名 | https://$CUSTOM_DOMAIN |"
              echo "| 后台 | https://$CUSTOM_DOMAIN/admin |"
            else
              if [ -n "${{ steps.deploy_worker.outputs.deploy_url }}" ]; then
                echo "| 后台 | ${{ steps.deploy_worker.outputs.deploy_url }}/admin |"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          MODE: ${{ steps.mode.outputs.mode }}
