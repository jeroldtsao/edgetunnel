name: Deploy to Cloudflare Pages

permissions:
  contents: read
  deployments: write

on:
  # 手动触发部署（推荐）
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview

  # 推送到 main 分支时自动部署
  push:
    branches:
      - main
    paths:
      - '_worker.js'
      - 'wrangler.toml'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'edgetunnel' }} --branch=${{ github.ref_name }}

      - name: Deployment Summary
        run: |
          echo "✅ 部署完成!"
          echo "📄 项目名称: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'edgetunnel' }}"
          echo "🌐 访问地址: https://${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'edgetunnel' }}.pages.dev"
          echo "🔧 管理后台: https://${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'edgetunnel' }}.pages.dev/admin"