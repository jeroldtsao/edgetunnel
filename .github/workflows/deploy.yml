name: Deploy to Cloudflare Pages

permissions:
  contents: read
  deployments: write

on:
  # 手动触发部署（推荐）
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
      create_kv:
        description: '自动创建 KV 命名空间（首次部署时开启）'
        required: false
        default: false
        type: boolean
      kv_name:
        description: 'KV 命名空间名称'
        required: false
        default: 'EDT2'
        type: string

  # 推送到 main 分支时自动部署
  push:
    branches:
      - main
    paths:
      - '_worker.js'
      - 'wrangler.toml'
      - '.github/workflows/deploy.yml'

env:
  PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'edgetunnel' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Create Pages Project (if not exists)
        run: |
          echo "检查 Pages 项目是否存在..."
          if ! wrangler pages project list | grep -q "${{ env.PROJECT_NAME }}"; then
            echo "创建新的 Pages 项目: ${{ env.PROJECT_NAME }}"
            wrangler pages project create "${{ env.PROJECT_NAME }}" --production-branch=main || true
          else
            echo "Pages 项目已存在: ${{ env.PROJECT_NAME }}"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Create KV Namespace (if requested)
        id: create_kv
        if: ${{ github.event.inputs.create_kv == 'true' }}
        run: |
          KV_NAME="${{ github.event.inputs.kv_name || 'EDT2' }}"
          echo "检查 KV 命名空间是否存在..."

          # 获取现有 KV 列表
          KV_LIST=$(wrangler kv namespace list --json)
          KV_EXISTS=$(echo "$KV_LIST" | jq -r '.[] | select(.title == "'$KV_NAME'") | .id' || echo "")

          if [ -z "$KV_EXISTS" ]; then
            echo "创建新的 KV 命名空间: $KV_NAME"
            KV_RESULT=$(wrangler kv namespace create "$KV_NAME" --json)
            KV_ID=$(echo "$KV_RESULT" | jq -r '.id')
            echo "KV_ID=$KV_ID" >> $GITHUB_OUTPUT
            echo "创建成功，KV ID: $KV_ID"
          else
            echo "KV 命名空间已存在: $KV_NAME"
            echo "KV_ID=$KV_EXISTS" >> $GITHUB_OUTPUT
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Bind KV to Pages Project
        if: ${{ steps.create_kv.outputs.KV_ID }}
        run: |
          echo "绑定 KV 命名空间到 Pages 项目..."
          KV_ID="${{ steps.create_kv.outputs.KV_ID }}"

          # 使用 Cloudflare API 绑定 KV
          curl -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/${{ env.PROJECT_NAME }}" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{
              "deployment_configs": {
                "production": {
                  "kv_bindings": [
                    {
                      "binding": "KV",
                      "namespace_id": "'$KV_ID'"
                    }
                  ]
                }
              }
            }'

          echo "KV 绑定完成"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set ADMIN Environment Variable
        run: |
          echo "设置 ADMIN 环境变量..."

          # 使用 Cloudflare API 设置环境变量
          curl -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/${{ env.PROJECT_NAME }}" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{
              "deployment_configs": {
                "production": {
                  "env_vars": {
                    "ADMIN": {
                      "value": "${{ secrets.ADMIN_PASSWORD }}"
                    }
                  }
                }
              }
            }'

          echo "ADMIN 环境变量已设置"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=${{ env.PROJECT_NAME }} --branch=${{ github.ref_name }}

      - name: Deployment Summary
        run: |
          echo "## ✅ 部署完成!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| 📄 项目名称 | ${{ env.PROJECT_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 访问地址 | https://${{ env.PROJECT_NAME }}.pages.dev |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔧 管理后台 | https://${{ env.PROJECT_NAME }}.pages.dev/admin |" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.create_kv.outputs.KV_ID }}" ]; then
            echo "| 🗄️ KV 绑定 | 已绑定 (ID: ${{ steps.create_kv.outputs.KV_ID }}) |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| 🔐 ADMIN | 已配置 |" >> $GITHUB_STEP_SUMMARY