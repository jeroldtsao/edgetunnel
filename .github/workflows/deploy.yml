name: Deploy to Cloudflare Pages

permissions:
  contents: read
  deployments: write

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - '_worker.js'
      - 'wrangler.toml'
      - '.github/workflows/deploy.yml'

env:
  PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'edgetunnel' }}
  CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN || '' }}
  KV_NAME: ${{ vars.KV_NAME || 'EDT2' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install -g wrangler
          sudo apt-get install -y jq

      # 检查并创建 Pages 项目（使用 API）
      - name: Ensure Pages Project
        run: |
          echo "检查 Pages 项目..."

          # 使用 API 检查项目是否存在
          CHECK=$(curl -s -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/${{ env.PROJECT_NAME }}" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json")

          HTTP_CODE=$(echo "$CHECK" | tail -c 4)

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Pages 项目已存在: ${{ env.PROJECT_NAME }}"
          else
            echo "创建 Pages 项目: ${{ env.PROJECT_NAME }}"
            curl -s -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"name":"${{ env.PROJECT_NAME }}","production_branch":"main"}' \
              | jq -r '.success' && echo "✅ Pages 项目创建成功" || echo "⚠️ 项目创建失败，可能已存在"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 检查并创建 KV 命名空间（使用 API）
      - name: Ensure KV Namespace
        id: kv
        run: |
          echo "检查 KV 命名空间..."
          KV_NAME="${{ env.KV_NAME }}"

          # 使用 API 查询现有 KV
          KV_LIST=$(curl -s \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/storage/kv/namespaces" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}")

          # 查找同名 KV 的 ID（使用 jq --arg 变量）
          KV_ID=$(echo "$KV_LIST" | jq -r --arg name "$KV_NAME" '.result[] | select(.title == $name) | .id' | head -1)

          if [ -n "$KV_ID" ] && [ "$KV_ID" != "null" ]; then
            echo "✅ KV 命名空间已存在: $KV_NAME (ID: $KV_ID)"
            echo "kv_id=$KV_ID" >> $GITHUB_OUTPUT
          else
            echo "创建 KV 命名空间: $KV_NAME"
            CREATE_RESULT=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/storage/kv/namespaces" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"title\":\"$KV_NAME\"}")

            KV_ID=$(echo "$CREATE_RESULT" | jq -r '.result.id')

            if [ -n "$KV_ID" ] && [ "$KV_ID" != "null" ]; then
              echo "✅ KV 命名空间创建成功: $KV_NAME (ID: $KV_ID)"
              echo "kv_id=$KV_ID" >> $GITHUB_OUTPUT
            else
              echo "::warning::KV 创建失败"
              echo "$CREATE_RESULT" | jq '.errors'
            fi
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 绑定 KV 到 Pages（使用 wrangler）
      - name: Bind KV to Pages
        if: ${{ steps.kv.outputs.kv_id }}
        run: |
          echo "绑定 KV 到 Pages..."
          KV_ID="${{ steps.kv.outputs.kv_id }}"
          PROJECT="${{ env.PROJECT_NAME }}"

          # 使用 wrangler 绑定 KV
          wrangler pages project edit "$PROJECT" --kv KV="$KV_ID" 2>&1 || true

          # 验证绑定是否成功（使用 API）
          VERIFY=$(curl -s \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/$PROJECT" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}")

          KV_BOUND=$(echo "$VERIFY" | jq -r '.result.deployment_configs.production.kv_bindings[] | select(.binding == "KV") | .namespace_id' | head -1)

          if [ -n "$KV_BOUND" ] && [ "$KV_BOUND" = "$KV_ID" ]; then
            echo "✅ KV 绑定成功"
          else
            echo "::warning::KV 绑定可能失败，尝试使用 API..."

            # 备用方案：使用 API PATCH
            curl -s -X PATCH \
              "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/$PROJECT" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"deployment_configs\":{\"production\":{\"kv_bindings\":[{\"binding\":\"KV\",\"namespace_id\":\"$KV_ID\"}]}}}" \
              | jq '.success' && echo "✅ API 绑定完成"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 设置环境变量（使用 API）
      - name: Set Environment Variables
        run: |
          echo "设置环境变量..."

          # 使用 jq 正确构造 JSON
          ENV_JSON=$(jq -n \
            --arg admin "${{ secrets.ADMIN_PASSWORD }}" \
            '{"ADMIN":{"value":$admin}}')

          # 添加可选变量
          if [ -n "${{ secrets.UUID }}" ]; then
            ENV_JSON=$(echo "$ENV_JSON" | jq --arg uuid "${{ secrets.UUID }}" '.UUID={"value":$uuid}')
          fi
          if [ -n "${{ secrets.PROXYIP }}" ]; then
            ENV_JSON=$(echo "$ENV_JSON" | jq --arg proxy "${{ secrets.PROXYIP }}" '.PROXYIP={"value":$proxy}')
          fi
          if [ -n "${{ secrets.KEY }}" ]; then
            ENV_JSON=$(echo "$ENV_JSON" | jq --arg key "${{ secrets.KEY }}" '.KEY={"value":$key}')
          fi

          echo "发送配置..."
          RESULT=$(curl -s -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/${{ env.PROJECT_NAME }}" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"deployment_configs\":{\"production\":{\"env_vars\":$ENV_JSON}}}")

          if echo "$RESULT" | jq -e '.success' > /dev/null; then
            echo "✅ 环境变量已设置"
          else
            echo "⚠️ 环境变量设置失败"
            echo "$RESULT" | jq '.errors'
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 绑定自定义域名（使用 API）
      - name: Bind Custom Domain
        if: ${{ env.CUSTOM_DOMAIN }}
        run: |
          echo "检查域名绑定..."
          DOMAIN="${{ env.CUSTOM_DOMAIN }}"
          PROJECT="${{ env.PROJECT_NAME }}"

          # 检查域名是否已绑定
          DOMAIN_LIST=$(curl -s \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/$PROJECT/domains" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}")

          if echo "$DOMAIN_LIST" | jq -e '.result[] | select(.name=="$DOMAIN")' > /dev/null 2>&1; then
            echo "✅ 域名已绑定: $DOMAIN"
          else
            echo "绑定域名: $DOMAIN"
            BIND_RESULT=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/$PROJECT/domains" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"$DOMAIN\"}")

            if echo "$BIND_RESULT" | jq -e '.success' > /dev/null 2>&1; then
              echo "✅ 域名绑定成功"

              # 添加 CNAME 记录
              ZONE=$(echo "$DOMAIN" | rev | cut -d'.' -f1-2 | rev)
              echo "查找 Zone: $ZONE"

              ZONE_RESULT=$(curl -s \
                "https://api.cloudflare.com/client/v4/zones?name=$ZONE" \
                -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}")

              ZONE_ID=$(echo "$ZONE_RESULT" | jq -r '.result[0].id // empty')

              if [ -n "$ZONE_ID" ]; then
                echo "Zone ID: $ZONE_ID"

                # 提取子域名部分
                SUB=$(echo "$DOMAIN" | sed "s/\.$ZONE\$//" | sed "s/^$ZONE$/@/")
                CNAME_TARGET="$PROJECT.pages.dev"

                echo "添加 CNAME: $SUB -> $CNAME_TARGET"

                DNS_RESULT=$(curl -s -X POST \
                  "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
                  -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
                  -H "Content-Type: application/json" \
                  -d "{\"type\":\"CNAME\",\"name\":\"$SUB\",\"content\":\"$CNAME_TARGET\",\"ttl\":1,\"proxied\":true}")

                if echo "$DNS_RESULT" | jq -e '.success' > /dev/null 2>&1; then
                  echo "✅ CNAME 记录已添加"
                else
                  DNS_ERROR=$(echo "$DNS_RESULT" | jq -r '.errors[0].message // "添加失败"')
                  echo "::warning::CNAME 记录添加失败: $DNS_ERROR（可能已存在）"
                fi
              else
                echo "::warning::未找到 Zone: $ZONE，请手动添加 CNAME 记录"
              fi
            else
              ERROR=$(echo "$BIND_RESULT" | jq -r '.errors[0].message // "绑定失败"')
              echo "::warning::域名绑定失败: $ERROR"
            fi
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=${{ env.PROJECT_NAME }} --branch=${{ github.ref_name }}

      - name: Summary
        run: |
          echo "## ✅ 部署完成!" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| 📄 项目 | ${{ env.PROJECT_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 地址 | https://${{ env.PROJECT_NAME }}.pages.dev |" >> $GITHUB_STEP_SUMMARY
          [ "${{ env.CUSTOM_DOMAIN }}" ] && echo "| 🌐 域名 | https://${{ env.CUSTOM_DOMAIN }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔧 后台 | https://${{ env.CUSTOM_DOMAIN || env.PROJECT_NAME }}/admin |" >> $GITHUB_STEP_SUMMARY